[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "occupation-panel-pipeline-v2"
version = "0.1.0"
description = "Survey-weighted occupational panel and time-out forecasting research pipeline"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
analysis = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "pyarrow>=18,<30",
  "pyreadstat>=1.2,<2",
  "scikit-learn>=1.5,<2",
  "lightgbm>=4.5,<5",
]
dev = ["pytest>=8,<10"]
visualization = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "Pillow>=10,<13",
  "openpyxl>=3.1,<4",
]

[tool.setuptools]
package-dir = { "pipeline_v2" = "." }
packages = ["pipeline_v2", "pipeline_v2.sources"]

[tool.pytest.ini_options]
testpaths = ["pipeline_v2/tests"]
